[workspace]
resolver = "2"
members = ["crates/tf-gmsh", "crates/tf-geom", "crates/tf-server", "crates/tf-bem", "crates/tf-bench", "crates/tf-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tf-gmsh = { path = "crates/tf-gmsh" }
tf-geom = { path = "crates/tf-geom" }
tf-bem = { path = "crates/tf-bem" }
tf-app = { path = "crates/tf-app" }

# atomic-wait 1.1.0 + an Emscripten futex backend, so faer's thread pool (spindle) runs on
# WebAssembly threads
[patch.crates-io]
atomic-wait = { path = "patches/atomic-wait" }

[profile.dev.package."*"]
opt-level = 2

# the solver is compute-bound; keep it fast in dev builds (the GUI server runs as a dev build)
[profile.dev.package.tf-bem]
opt-level = 3
