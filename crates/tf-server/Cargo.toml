[package]
name = "tf-server"
description = "trapfields GUI backend: HTTP API over the geometry/meshing pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "trapfields"
path = "src/main.rs"

[dependencies]
tf-gmsh.workspace = true
tf-geom.workspace = true
tf-bem.workspace = true
rayon = "1"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
